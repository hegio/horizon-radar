name: Daily Horizon Summary

on:
  schedule:
    # GitHub cron uses UTC. 19:00 UTC = 03:00 Asia/Taipei (next morning).
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Fetch window in hours (default 24)'
        required: false
        default: '24'
      endpoint:
        description: 'Model endpoint: cloud (default) or local (needs repo var LOCAL_AI_BASE_URL + secret LOCAL_API_KEY, and your PC must be online)'
        type: choice
        options: [cloud, local]
        default: cloud

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Select model endpoint
        env:
          LOCAL_AI_BASE_URL: ${{ vars.LOCAL_AI_BASE_URL }}
        run: python scripts/set_endpoint.py ${{ inputs.endpoint || 'cloud' }}

      - name: Run Horizon
        env:
          MAAS_API_KEY: *** secrets.MAAS_API_KEY }}
          LOCAL_API_KEY: *** secrets.LOCAL_API_KEY }}
          GITHUB_TOKEN: *** github.token }}
        run: uv run horizon -c data/config.github.json --hours ${{ inputs.hours || '24' }} -l INFO

      - name: Build collapsible briefing page
        run: |
          python scripts/make_collapsible.py \
            "data/summaries/$(date +'%Y-%m-%d')-zh.md" \
            "docs/_posts/$(date +'%Y-%m-%d')-summary-zh.md"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Summary: ${{ github.run_id }}"
          publish_branch: gh-pages
          enable_jekyll: true
